  function creaWorker() {
    const sorgente =
      'var caricato=false;var fonti=' + JSON.stringify(FONTI) + ';' +
      'for(var i=0;i<fonti.length;i++){try{importScripts(fonti[i]);caricato=true;break;}catch(e){}}' +
      'if(!caricato){postMessage("SESSANTAQUATTRO_NON_CARICATO");}';
    const blob = new Blob([sorgente], { type: 'application/javascript' });
    return new Worker(URL.createObjectURL(blob));
  }

  function avviaStockfish() {
    return new Promise((risolvi) => {
      let concluso = false;
      const fallisci = () => {
        if (concluso) return;
        concluso = true;
        try { if (worker) worker.terminate(); } catch (e) {}
        worker = null;
        tipo = 'locale';
        risolvi('locale');
      };
      let w;
      try { w = creaWorker(); } catch (e) { return fallisci(); }
      worker = w;
      const scadenza = setTimeout(fallisci, 15000);

      w.onerror = fallisci;
      w.onmessage = (ev) => {
        const riga = typeof ev.data === 'string' ? ev.data : (ev.data && ev.data.text) || '';
        if (riga.indexOf('SESSANTAQUATTRO_NON_CARICATO') === 0) return fallisci();
        if (riga.indexOf('uciok') === 0) { w.postMessage('isready'); return; }
        if (riga.indexOf('readyok') === 0) {
          if (concluso) return;
          concluso = true;
          clearTimeout(scadenza);
          w.onmessage = ascoltaAnalisi;
          tipo = 'stockfish';
          risolvi('stockfish');
          return;
        }
      };
      try { w.postMessage('uci'); } catch (e) { fallisci(); }
    });
  }

  function ascoltaAnalisi(ev) {
    const riga = typeof ev.data === 'string' ? ev.data : (ev.data && ev.data.text) || '';
    if (!richiesta) return;
    if (riga.indexOf('info ') === 0 && riga.indexOf(' pv ') > -1) {
      const prof = /\bdepth (\d+)/.exec(riga);
      const cp = /\bscore cp (-?\d+)/.exec(riga);
      const matto = /\bscore mate (-?\d+)/.exec(riga);
      const pv = riga.split(' pv ')[1];
      if (!pv) return;
      richiesta.parziale = {
        profondita: prof ? +prof[1] : 0,
        cp: cp ? +cp[1] : null,
        matto: matto ? +matto[1] : null,
        pv: pv.trim().split(/\s+/)
      };
      if (richiesta.onAggiornamento) richiesta.onAggiornamento(normalizza(richiesta.parziale, richiesta.fen));
    } else if (riga.indexOf('bestmove') === 0) {
      const parti = riga.split(/\s+/);
      const r = richiesta;
      richiesta = null;
      const esito = normalizza(r.parziale, r.fen);
      esito.migliore = parti[1] && parti[1] !== '(none)' ? parti[1] : (esito.pv[0] || null);
      r.risolvi(esito);
    }
  }

  function normalizza(parziale, fen) {
    const nero = fen.split(' ')[1] === 'b';
    if (!parziale) return { profondita: 0, cp: 0, matto: null, pv: [], migliore: null };
    return {
      profondita: parziale.profondita,
      cp: parziale.cp === null ? null : (nero ? -parziale.cp : parziale.cp),
      matto: parziale.matto === null ? null : (nero ? -parziale.matto : parziale.matto),
      pv: parziale.pv,
      migliore: parziale.pv[0] || null
    };
  }

  function inizializza() {
    if (!avvio) avvio = avviaStockfish();
    return avvio;
  }

  function analizza(fen, opzioni, onAggiornamento) {
    const esegui = () => inizializza().then((quale) => {
      if (quale === 'stockfish' && worker) {
        if (richiesta) { try { worker.postMessage('stop'); } catch (e) {} }
        return new Promise((risolvi) => {
          richiesta = { fen, risolvi, onAggiornamento, parziale: null };
          worker.postMessage('position fen ' + fen);
          worker.postMessage('go depth ' + opzioni.profondita + ' movetime ' + opzioni.tempoMs);
        });
      }
      return new Promise((risolvi) => {
        setTimeout(() => risolvi(MotoreLocale.cerca(fen, opzioni.profondita, opzioni.tempoMs)), 12);
      });
    });
    const p = coda.then(esegui, esegui);
    coda = p.then(() => {}, () => {});
    return p;
  }

  return {
    inizializza,
    analizza,
    tipo: () => tipo,
    profonditaSuggerita: () => (tipo === 'stockfish' ? 14 : 3),
    profonditaMassima: () => (tipo === 'stockfish' ? 20 : 4)
  };
})();

/* ---------------- motore interno di riserva ---------------- */

const MotoreLocale = (function () {
  const VALORE = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };
  const T = {
    p: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10,
        5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5,
        5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
    n: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30,
        -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30,
        -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
    b: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10,
        -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10,
        -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
    r: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5,
        -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
    q: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10,
        -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10,
        -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
    k: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
        -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10,
        20,20,0,0,0,20,20,20, 20,30,10,0,0,10,30,20]
  };
  const MATTO = 100000;
  const INTERROTTO = 'INTERROTTO';

  function valuta(ch) {
    const griglia = ch.board();
    let punti = 0;
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = griglia[r][c];
        if (!p) continue;
        const i = r * 8 + c;
        const base = VALORE[p.type] + T[p.type][p.color === 'w' ? i : (7 - r) * 8 + c];
        punti += p.color === 'w' ? base : -base;
      }
    }
    return ch.turn() === 'w' ? punti : -punti;
  }

  function ordina(mosse) {
    return mosse.slice().sort((a, b) => peso(b) - peso(a));
  }
  function peso(m) {
    let p = 0;
    if (m.captured) p += 10 * VALORE[m.captured] - VALORE[m.piece];
    if (m.promotion) p += VALORE[m.promotion];
    if (m.san.indexOf('+') > -1) p += 40;
    return p;
  }

  function quiescenza(ch, alfa, beta, scadenza, profondita) {
    if (Date.now() > scadenza) throw INTERROTTO;
    const fermo = valuta(ch);
    if (fermo >= beta) return beta;
    if (fermo > alfa) alfa = fermo;
    if (profondita <= 0) return alfa;
    const prese = ordina(ch.moves({ verbose: true }).filter((m) => m.captured || m.promotion));
    for (const m of prese) {
      ch.move(m);
      const p = -quiescenza(ch, -beta, -alfa, scadenza, profondita - 1);
      ch.undo();
      if (p >= beta) return beta;
      if (p > alfa) alfa = p;
    }
    return alfa;
  }

  function negamax(ch, profondita, alfa, beta, scadenza, linea, livello) {
    if (Date.now() > scadenza) throw INTERROTTO;
    const mosse = ch.moves({ verbose: true });
    if (!mosse.length) return ch.in_check() ? -(MATTO - livello) : 0;
    if (profondita <= 0) return quiescenza(ch, alfa, beta, scadenza, 3);
    let migliore = null;
    for (const m of ordina(mosse)) {
      ch.move(m);
      const sotto = [];
      const p = -negamax(ch, profondita - 1, -beta, -alfa, scadenza, sotto, livello + 1);
      ch.undo();
      if (p > alfa) { alfa = p; migliore = m; linea.length = 0; linea.push(m.san, ...sotto); }
      if (alfa >= beta) break;
    }
    if (migliore === null && linea) linea.length = 0;
    return alfa;
  }

  function cerca(fen, profonditaMax, tempoMs) {
    const ch = new Chess(fen);
    const scadenza = Date.now() + Math.min(tempoMs || 1200, 3000);
    const mosse = ch.moves({ verbose: true });
    if (!mosse.length) return { profondita: 0, cp: 0, matto: null, pv: [], migliore: null, san: null };
    let sanMigliore = mosse[0].san;
    let uciMigliore = mosse[0].from + mosse[0].to + (mosse[0].promotion || '');
    let punteggio = 0, pv = [sanMigliore], raggiunta = 0;

    for (let d = 1; d <= Math.max(1, profonditaMax); d++) {
      let alfa = -Infinity, sanGiro = null, uciGiro = null, pvGiro = [];
      try {
        for (const m of ordina(mosse)) {
          ch.move(m);
          const sotto = [];
          const p = -negamax(ch, d - 1, -Infinity, -alfa, scadenza, sotto, 1);
          ch.undo();
          if (p > alfa || sanGiro === null) {
            alfa = p; sanGiro = m.san;
            uciGiro = m.from + m.to + (m.promotion || '');
            pvGiro = [m.san, ...sotto];
          }
        }
      } catch (e) {
        if (e !== INTERROTTO) throw e;
        break;
      }
      sanMigliore = sanGiro; uciMigliore = uciGiro; punteggio = alfa; pv = pvGiro; raggiunta = d;
      if (Math.abs(alfa) > MATTO - 200) break;
    }

    const nero = ch.turn() === 'b';
    let cp = punteggio, matto = null;
    if (Math.abs(punteggio) > MATTO - 200) {
      const distanza = Math.max(1, Math.ceil((MATTO - Math.abs(punteggio)) / 2));
      matto = punteggio > 0 ? distanza : -distanza;
      cp = null;
    }
    return {
      profondita: raggiunta,
      cp: cp === null ? null : (nero ? -cp : cp),
      matto: matto === null ? null : (nero ? -matto : matto),
      pv: [], pvSan: pv, migliore: uciMigliore, san: sanMigliore
    };
  }

  return { cerca };
})();

/* ================================================================
   UTILITÀ SCACCHISTICHE
   ================================================================ */

const COLONNE = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
const GLIFI = { k: '\u265A', q: '\u265B', r: '\u265C', b: '\u265D', n: '\u265E', p: '\u265F' };
const NOMI_PEZZI = { q: 'Donna', r: 'Torre', b: 'Alfiere', n: 'Cavallo' };

function elencoMosse(testo) {
  return testo.trim().split(/\s+/);
}

function costruisci(mosse) {
  const ch = new Chess();
  for (const m of mosse) {
    if (!ch.move(m, { sloppy: true })) break;
  }
  return ch;
}

function casaDelRe(ch) {
  if (!ch.in_check()) return null;
  const griglia = ch.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = griglia[r][c];
      if (p && p.type === 'k' && p.color === ch.turn()) return COLONNE[c] + (8 - r);
    }
  }
  return null;
}

function uciInSan(fen, listaUci, quante) {
  const ch = new Chess(fen);
  const fuori = [];
  for (const u of (listaUci || []).slice(0, quante || 8)) {
    const m = ch.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] || 'q' });
    if (!m) break;
    fuori.push(m.san);
  }
  return fuori;
}

function formattaValutazione(cp, matto) {
  if (matto !== null && matto !== undefined) return (matto > 0 ? 'M' : '-M') + Math.abs(matto);
  if (cp === null || cp === undefined) return '—';
  const v = cp / 100;
  return (v > 0 ? '+' : v < 0 ? '\u2212' : '') + Math.abs(v).toFixed(2);
}

function quotaBianco(cp, matto) {
  if (matto !== null && matto !== undefined) return matto > 0 ? 100 : 0;
  if (cp === null || cp === undefined) return 50;
  return 100 / (1 + Math.exp(-cp / 380));
}

function descriviEsito(ch) {
  if (ch.in_checkmate()) return ch.turn() === 'w' ? 'Scacco matto: vince il nero.' : 'Scacco matto: vince il bianco.';
  if (ch.in_stalemate()) return 'Stallo: patta.';
  if (ch.in_threefold_repetition()) return 'Patta per triplice ripetizione.';
  if (ch.insufficient_material()) return 'Patta per materiale insufficiente.';
  if (ch.in_draw()) return 'Patta.';
  if (ch.in_check()) return 'Scacco.';
  return null;
}

/* ================================================================
   SCACCHIERA
   ================================================================ */

function Scacchiera({ posizione, orientamento, ultimaMossa, selezione, destinazioni, onCasa, interattiva }) {
  const griglia = posizione.board();
  const scacco = casaDelRe(posizione);
  const righe = orientamento === 'b' ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];
  const colonne = orientamento === 'b' ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
  const case_ = [];

  for (const r of righe) {
    for (const c of colonne) {
      const nome = COLONNE[c] + (8 - r);
      const pezzo = griglia[r][c];
      const scura = (r + c) % 2 === 1;
      const bersaglio = destinazioni && destinazioni[nome];
      const classi = ['casa'];
      if (scura) classi.push('scura');
      if (interattiva) classi.push('cliccabile');
      if (ultimaMossa && (ultimaMossa.from === nome || ultimaMossa.to === nome)) classi.push('ultima');
      if (selezione === nome) classi.push('selezionata');
      if (scacco === nome) classi.push('scacco');
      case_.push(
        <button
          key={nome}
          type="button"
          className={classi.join(' ')}
          onClick={interattiva ? () => onCasa(nome) : undefined}
          tabIndex={interattiva ? 0 : -1}
          aria-label={nome + (pezzo ? ', ' + (pezzo.color === 'w' ? 'bianco' : 'nero') : ', vuota')}
        >
          {pezzo && <span className={'pezzo ' + (pezzo.color === 'w' ? 'b' : 'n')}>{GLIFI[pezzo.type]}</span>}
          {bersaglio && <span className={'bersaglio' + (pezzo ? ' presa' : '')} />}
          {c === (orientamento === 'b' ? 7 : 0) && <span className="coordinata rig">{8 - r}</span>}
          {r === (orientamento === 'b' ? 0 : 7) && <span className="coordinata col">{COLONNE[c]}</span>}
        </button>
      );
    }
  }
  return <div className="scacchiera">{case_}</div>;
}

/* ================================================================
   LISTA MOSSE
   ================================================================ */

function ListaMosse({ mosse, ply, onVai, divergenza }) {
  const contenitore = useRef(null);
  useEffect(() => {
    const n = contenitore.current && contenitore.current.querySelector('[aria-current="true"]');
    if (n && n.scrollIntoView) n.scrollIntoView({ block: 'nearest' });
  }, [ply]);

  const righe = [];
  for (let i = 0; i < mosse.length; i += 2) {
    righe.push(
      <div className="mossa-riga" key={i}>
        <span className="num">{i / 2 + 1}.</span>
        <button
          type="button"
          className={divergenza !== null && i >= divergenza ? 'var' : ''}
          aria-current={ply === i + 1}
          onClick={() => onVai(i + 1)}
        >{mosse[i]}</button>
        {mosse[i + 1] ? (
          <button
            type="button"
            className={divergenza !== null && i + 1 >= divergenza ? 'var' : ''}
            aria-current={ply === i + 2}
            onClick={() => onVai(i + 2)}
          >{mosse[i + 1]}</button>
        ) : <span />}
      </div>
    );
  }
  return <div className="mosse" ref={contenitore}>{righe.length ? righe : <p style={{ color: 'var(--smorzato)', fontSize: 14 }}>Nessuna mossa.</p>}</div>;
}

/* ================================================================
   PANNELLO MOTORE
   ================================================================ */

function PannelloMotore({ fen, automatico, onGioca, etichettaGioca }) {
  const [esito, setEsito] = useState(null);
  const [calcolando, setCalcolando] = useState(false);
  const [profondita, setProfondita] = useState(null);
  const [tipo, setTipo] = useState(null);
  const [acceso, setAcceso] = useState(automatico);
  const richiestaId = useRef(0);

  // Stockfish pesa qualche megabyte: si scarica solo quando il motore viene acceso.
  useEffect(() => {
    if (!acceso) return;
    let vivo = true;
    Motore.inizializza().then((t) => {
      if (!vivo) return;
      setTipo(t);
      setProfondita((p) => (p === null ? Motore.profonditaSuggerita() : p));
    });
    return () => { vivo = false; };
  }, [acceso]);

  const analizza = useCallback(() => {
    if (profondita === null) return;
    const id = ++richiestaId.current;
    setCalcolando(true);
    setEsito(null);
    Motore.analizza(fen, { profondita, tempoMs: 2500 }, (parziale) => {
      if (richiestaId.current === id) setEsito(parziale);
    }).then((finale) => {
      if (richiestaId.current !== id) return;
      setEsito(finale);
      setCalcolando(false);
    }).catch(() => { if (richiestaId.current === id) setCalcolando(false); });
  }, [fen, profondita]);

  useEffect(() => {
    if (!acceso || profondita === null) { richiestaId.current++; setEsito(null); setCalcolando(false); return; }
    const ch = new Chess(fen);
    if (ch.game_over()) { setEsito(null); setCalcolando(false); return; }
    analizza();
  }, [fen, acceso, profondita, analizza]);

  const ch = useMemo(() => new Chess(fen), [fen]);
  const finita = ch.game_over();
  const quota = esito ? quotaBianco(esito.cp, esito.matto) : 50;
  const sanMigliore = esito && esito.migliore
    ? (esito.san || uciInSan(fen, [esito.migliore], 1)[0] || null)
    : null;
  const lineaSan = esito
    ? (esito.pvSan && esito.pvSan.length ? esito.pvSan.slice(0, 8) : uciInSan(fen, esito.pv, 8))
    : [];

  return (
    <div className="pannello">
      <h3>Motore</h3>

      {finita ? (
        <p>La partita è finita: non c'è più niente da calcolare.</p>
      ) : !acceso ? (
        <p>Il motore è spento. Accendilo per vedere la valutazione della posizione e la mossa migliore.</p>
      ) : (
        <div>
          <div className="valutazione">
            <span className={'cifra' + (esito && ((esito.cp !== null && esito.cp < 0) || (esito.matto !== null && esito.matto < 0)) ? ' n' : '')}>
              {esito ? formattaValutazione(esito.cp, esito.matto) : '…'}
            </span>
            <span className="eco">{esito && esito.profondita ? 'profondità ' + esito.profondita : (calcolando ? 'sto calcolando' : '')}</span>
          </div>
          <div className="barra"><i style={{ width: quota + '%' }} /></div>
          {sanMigliore && (
            <div className="dettaglio">
              Mossa migliore: <span className="migliore">{sanMigliore}</span>
            </div>
          )}
          {lineaSan.length > 1 && (
            <div className="dettaglio">Linea: <b>{lineaSan.join(' ')}</b></div>
          )}
          {sanMigliore && onGioca && (
            <div className="riga-tasti">
              <button type="button" className="tasto pieno" onClick={() => onGioca(sanMigliore)}>
                {etichettaGioca || 'Gioca ' + sanMigliore}
              </button>
            </div>
          )}
        </div>
      )}

      <div className="campo">
        <button type="button" className="tasto" onClick={() => setAcceso(!acceso)}>
          {acceso ? 'Spegni il motore' : 'Accendi il motore'}
        </button>
        {acceso && !finita && (
          <button type="button" className="tasto" onClick={analizza} disabled={calcolando}>
            Ricalcola
          </button>
        )}
      </div>

      {acceso && profondita !== null && (
        <div className="campo">
          <label htmlFor="prof">Profondità {profondita}</label>
          <input
            id="prof" type="range" min="1" max={Motore.profonditaMassima()} value={profondita}
            onChange={(e) => setProfondita(+e.target.value)}
          />
        </div>
      )}

      {acceso && (
        <span className="spia">
          <i className={tipo === 'stockfish' ? '' : tipo === null ? 'attesa' : 'locale'} />
          {tipo === 'stockfish' ? 'Stockfish, in esecuzione nel browser'
            : tipo === null ? 'sto scaricando il motore'
            : 'motore interno di riserva'}
        </span>
      )}
    </div>
  );
}

/* ================================================================
   SCACCHIERA GIOCABILE (usata da tutte e tre le sezioni)
   ================================================================ */

function useLinea(mosseOriginali) {
  const [mosse, setMosse] = useState(mosseOriginali);
  const [ply, setPly] = useState(mosseOriginali.length ? 0 : 0);

  useEffect(() => { setMosse(mosseOriginali); setPly(0); }, [mosseOriginali]);

  const divergenza = useMemo(() => {
    for (let i = 0; i < mosse.length; i++) {
      if (mosse[i] !== mosseOriginali[i]) return i;
    }
    return mosse.length < mosseOriginali.length ? null : null;
  }, [mosse, mosseOriginali]);

  const posizione = useMemo(() => costruisci(mosse.slice(0, ply)), [mosse, ply]);

  const ultimaMossa = useMemo(() => {
    if (!ply) return null;
    const storia = posizione.history({ verbose: true });
    const u = storia[storia.length - 1];
    return u ? { from: u.from, to: u.to } : null;
  }, [posizione, ply]);

  function gioca(mossa) {
    const ch = costruisci(mosse.slice(0, ply));
    const fatta = ch.move(mossa);
    if (!fatta) return false;
    if (mosse[ply] === fatta.san) { setPly(ply + 1); return true; }
    setMosse(mosse.slice(0, ply).concat([fatta.san]));
    setPly(ply + 1);
    return true;
  }

  function ripristina() { setMosse(mosseOriginali); }
  function ricomincia() { setMosse(mosseOriginali); setPly(0); }

  return { mosse, ply, setPly, posizione, ultimaMossa, divergenza, gioca, ripristina, ricomincia };
}

function ScacchieraGiocabile({ linea, orientamento, interattiva }) {
  const [selezione, setSelezione] = useState(null);
  const [promozione, setPromozione] = useState(null);
  const { posizione, ply, ultimaMossa, gioca } = linea;

  useEffect(() => { setSelezione(null); }, [ply, posizione]);

  const destinazioni = useMemo(() => {
    if (!selezione) return null;
    const m = {};
    posizione.moves({ square: selezione, verbose: true }).forEach((x) => { m[x.to] = true; });
    return m;
  }, [selezione, posizione]);

  function suCasa(casa) {
    const pezzo = posizione.get(casa);
    if (selezione) {
      const candidate = posizione.moves({ square: selezione, verbose: true }).filter((m) => m.to === casa);
      if (candidate.length) {
        if (candidate.some((m) => m.promotion)) { setPromozione({ from: selezione, to: casa }); setSelezione(null); return; }
        gioca({ from: selezione, to: casa });
        setSelezione(null);
        return;
      }
    }
    if (pezzo && pezzo.color === posizione.turn()) setSelezione(casa === selezione ? null : casa);
    else setSelezione(null);
  }

  return (
    <div className="scacchiera-guscio">
      <Scacchiera
        posizione={posizione}
        orientamento={orientamento}
        ultimaMossa={ultimaMossa}
        selezione={selezione}
        destinazioni={destinazioni}
        onCasa={suCasa}
        interattiva={interattiva && !posizione.game_over()}
      />
      {promozione && (
        <div className="velo" onClick={() => setPromozione(null)}>
          <div className="dialogo" onClick={(e) => e.stopPropagation()}>
            <h3>Scegli il pezzo</h3>
            <div className="scelte">
              {['q', 'r', 'b', 'n'].map((p) => (
                <button key={p} type="button" title={NOMI_PEZZI[p]} onClick={() => {
                  gioca({ from: promozione.from, to: promozione.to, promotion: p });
                  setPromozione(null);
                }}>
                  <span className={'pezzo ' + (posizione.turn() === 'w' ? 'b' : 'n')}>{GLIFI[p]}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Navigazione({ linea, onGira, extra }) {
  const { ply, setPly, mosse } = linea;
  useEffect(() => {
    function tasti(e) {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === 'ArrowLeft') { setPly(Math.max(0, ply - 1)); }
      else if (e.key === 'ArrowRight') { setPly(Math.min(mosse.length, ply + 1)); }
    }
    window.addEventListener('keydown', tasti);
    return () => window.removeEventListener('keydown', tasti);
  }, [ply, mosse.length, setPly]);

  return (
    <div className="controlli">
      <button type="button" className="tasto nav" onClick={() => setPly(0)} disabled={ply === 0} aria-label="Vai all'inizio">&#124;&#9664;</button>
      <button type="button" className="tasto nav" onClick={() => setPly(Math.max(0, ply - 1))} disabled={ply === 0} aria-label="Mossa precedente">&#9664;</button>
      <button type="button" className="tasto nav" onClick={() => setPly(Math.min(mosse.length, ply + 1))} disabled={ply >= mosse.length} aria-label="Mossa successiva">&#9654;</button>
      <button type="button" className="tasto nav" onClick={() => setPly(mosse.length)} disabled={ply >= mosse.length} aria-label="Vai alla fine">&#9654;&#124;</button>
      {onGira && <button type="button" className="tasto" onClick={onGira}>Gira la scacchiera</button>}
      {extra}
    </div>
  );
}

/* ================================================================
   SEZIONE: PARTITE
   ================================================================ */

function SezionePartite({ primoAvvio, consumaPrimoAvvio }) {
  const [idPartita, setIdPartita] = useState(DATI.partite[0].id);
  const partita = DATI.partite.find((p) => p.id === idPartita);
  const originali = useMemo(() => elencoMosse(partita.mosse), [partita]);
  const linea = useLinea(originali);
  const [orientamento, setOrientamento] = useState('w');
  const [inArrivo, setInArrivo] = useState(false);

  // Unico movimento non richiesto della pagina: al primo caricamento la
  // scacchiera gioca da sola le ultime semimosse dell'Immortale.
  useEffect(() => {
    if (!primoAvvio) return;
    consumaPrimoAvvio();
    const totale = originali.length;
    const ridotto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (ridotto) { linea.setPly(totale); return; }
    let corrente = Math.max(0, totale - 8);
    linea.setPly(corrente);
    setInArrivo(true);
    const t = setInterval(() => {
      corrente += 1;
      linea.setPly(corrente);
      if (corrente >= totale) { clearInterval(t); setInArrivo(false); }
    }, 850);
    return () => clearInterval(t);
    // eslint-disable-next-line
  }, []);

  const nota = linea.divergenza === null && partita.note[linea.ply] ? partita.note[linea.ply] : null;
  const esito = descriviEsito(linea.posizione);
  const inVariante = linea.divergenza !== null;

  return (
    <div className="sezione">
      <div className="colonna-stretta">
        <div>
          <div className="famiglia">Undici partite</div>
          <div className="elenco">
            {DATI.partite.map((p) => (
              <button
                key={p.id}
                type="button"
                className="voce"
                aria-current={p.id === idPartita}
                onClick={() => { setIdPartita(p.id); setInArrivo(false); }}
              >
                <span className="vt">{p.titolo}</span>
                <span className="vs">{p.bianco.split(' ').slice(-1)[0]} – {p.nero.split(' ').slice(-1)[0]}, {p.anno}</span>
              </button>
            ))}
          </div>
        </div>

        <div>
          <div className="intestazione">
            <h2>{partita.titolo}</h2>
            <p className="giocatori">
              <b>{partita.bianco}</b> – <b>{partita.nero}</b> &nbsp;·&nbsp; {partita.luogo}, {partita.anno} &nbsp;·&nbsp; {partita.risultato} &nbsp;·&nbsp; {partita.apertura}
            </p>
            <p className="occhiello">{partita.occhiello}</p>
          </div>

          <div className="tavola">
            <div>
              <ScacchieraGiocabile linea={linea} orientamento={orientamento} interattiva={true} />
              <Navigazione
                linea={linea}
                onGira={() => setOrientamento(orientamento === 'w' ? 'b' : 'w')}
              />
              {inArrivo && (
                <div className="avviso">
                  Stai guardando il finale dell'<b>Immortale</b>. Premi il tasto di inizio per rivederla dalla prima mossa.
                </div>
              )}
              {inVariante && (
                <div className="avviso">
                  Hai lasciato la partita originale: da qui in poi <b>stai giocando tu</b>.
                  <div className="riga-tasti">
                    <button type="button" className="tasto" onClick={linea.ripristina}>Torna alla partita giocata</button>
                  </div>
                </div>
              )}
              {esito && <div className="esito">{esito}</div>}
              <div className="nota">
                {nota ? (
                  <span>
                    <span className="etichetta">Mossa {Math.ceil(linea.ply / 2)}{linea.ply % 2 ? '. ' : '… '}{linea.mosse[linea.ply - 1]}</span>
                    {nota}
                  </span>
                ) : linea.ply === 0 ? partita.intro
                  : inVariante ? 'Sei fuori dalla partita storica. Il motore qui sotto ti dice se la tua mossa regge.'
                  : 'Prosegui con le frecce o scegli una mossa dall\u2019elenco.'}
              </div>
            </div>

            <div>
              <div className="pannello">
                <h3>Mosse</h3>
                <ListaMosse mosse={linea.mosse} ply={linea.ply} onVai={linea.setPly} divergenza={linea.divergenza} />
              </div>
              <PannelloMotore fen={linea.posizione.fen()} automatico={false} onGioca={(san) => linea.gioca(san)} />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   SEZIONE: ANALISI
   ================================================================ */

const VUOTE = [];

function SezioneAnalisi() {
  const linea = useLinea(VUOTE);
  const [orientamento, setOrientamento] = useState('w');
  const [avversario, setAvversario] = useState('nessuno');
  const { posizione, mosse, ply } = linea;
  const fen = posizione.fen();

  useEffect(() => {
    if (avversario === 'nessuno') return;
    if (posizione.turn() !== avversario) return;
    if (posizione.game_over()) return;
    if (ply < mosse.length) return;
    let vivo = true;
    const t = setTimeout(() => {
      Motore.analizza(fen, { profondita: Motore.profonditaSuggerita(), tempoMs: 1500 }).then((r) => {
        if (!vivo || !r) return;
        const mossa = r.san || (r.migliore ? { from: r.migliore.slice(0, 2), to: r.migliore.slice(2, 4), promotion: r.migliore[4] || 'q' } : null);
        if (mossa) linea.gioca(mossa);
      });
    }, 250);
    return () => { vivo = false; clearTimeout(t); };
    // eslint-disable-next-line
  }, [fen, avversario, ply, mosse.length]);

  const esito = descriviEsito(posizione);

  return (
    <div className="sezione">
      <div className="intestazione">
        <h2>Analisi</h2>
        <p className="occhiello">Muovi liberamente e chiedi al motore qual è la mossa migliore, mossa dopo mossa.</p>
      </div>

      <div className="tavola">
        <div>
          <ScacchieraGiocabile linea={linea} orientamento={orientamento} interattiva={true} />
          <Navigazione
            linea={linea}
            onGira={() => setOrientamento(orientamento === 'w' ? 'b' : 'w')}
            extra={
              <button type="button" className="tasto" onClick={linea.ricomincia} disabled={!mosse.length}>Ricomincia</button>
            }
          />
          {esito && <div className="esito">{esito}</div>}
          <div className="campo">
            <label htmlFor="avv">Il motore gioca</label>
            <select id="avv" value={avversario} onChange={(e) => setAvversario(e.target.value)}>
              <option value="nessuno">nessuno: muovo io entrambi i colori</option>
              <option value="b">con il bianco</option>
              <option value="n">con il nero</option>
            </select>
          </div>
          <p className="dettaglio" style={{ marginTop: 14 }}>
            Con le frecce della tastiera torni indietro e vai avanti nella tua stessa partita. Se muovi dopo essere
            tornato indietro, la linea riparte da lì.
          </p>
        </div>

        <div>
          <PannelloMotore fen={fen} automatico={true} onGioca={(san) => linea.gioca(san)} />
          <div className="pannello">
            <h3>Mosse</h3>
            <ListaMosse mosse={linea.mosse} ply={linea.ply} onVai={linea.setPly} divergenza={null} />
            <div className="riga-tasti">
              <button type="button" className="tasto" onClick={() => {
                const testo = linea.mosse.map((m, i) => (i % 2 === 0 ? (i / 2 + 1) + '. ' : '') + m).join(' ');
                if (navigator.clipboard) navigator.clipboard.writeText(testo);
              }} disabled={!linea.mosse.length}>Copia le mosse</button>
              <button type="button" className="tasto" onClick={() => {
                if (navigator.clipboard) navigator.clipboard.writeText(fen);
              }}>Copia la FEN</button>
            </div>
            <p className="dettaglio">Posizione attuale<br /><b>{fen}</b></p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   SEZIONE: APERTURE
   ================================================================ */

function SezioneAperture() {
  const [idApertura, setIdApertura] = useState(DATI.aperture[0].id);
  const [mostraInsidia, setMostraInsidia] = useState(false);
  const apertura = DATI.aperture.find((a) => a.id === idApertura);
  const testo = mostraInsidia && apertura.insidia ? apertura.insidia.mosse : apertura.mosse;
  const originali = useMemo(() => elencoMosse(testo), [testo]);
  const linea = useLinea(originali);
  const [orientamento, setOrientamento] = useState('w');

  useEffect(() => { linea.setPly(originali.length); }, [originali]); // eslint-disable-line

  const famiglie = [];
  DATI.aperture.forEach((a) => {
    if (!famiglie.length || famiglie[famiglie.length - 1].nome !== a.famiglia) famiglie.push({ nome: a.famiglia, voci: [] });
    famiglie[famiglie.length - 1].voci.push(a);
  });

  function cambia(id) {
    setIdApertura(id);
    setMostraInsidia(false);
  }

  const inVariante = linea.divergenza !== null;

  return (
    <div className="sezione">
      <div className="colonna-stretta">
        <div>
          {famiglie.map((f) => (
            <div key={f.nome}>
              <div className="famiglia">{f.nome}</div>
              <div className="elenco">
                {f.voci.map((a) => (
                  <button key={a.id} type="button" className="voce" aria-current={a.id === idApertura} onClick={() => cambia(a.id)}>
                    <span className="vt">{a.nome}</span>
                    <span className="vs">{a.eco}</span>
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>

        <div>
          <div className="intestazione">
            <h2>{apertura.nome}</h2>
            <p className="giocatori">{apertura.eco} &nbsp;·&nbsp; {apertura.famiglia}</p>
          </div>

          <div className="tavola">
            <div>
              <ScacchieraGiocabile linea={linea} orientamento={orientamento} interattiva={true} />
              <Navigazione linea={linea} onGira={() => setOrientamento(orientamento === 'w' ? 'b' : 'w')} />
              {apertura.insidia && (
                <div className="riga-tasti">
                  <button
                    type="button"
                    className={'tasto' + (mostraInsidia ? ' pieno' : '')}
                    onClick={() => setMostraInsidia(!mostraInsidia)}
                  >
                    {mostraInsidia ? 'Torna alla linea principale' : 'Mostra l\u2019insidia: ' + apertura.insidia.nome}
                  </button>
                </div>
              )}
              {inVariante && (
                <div className="avviso">
                  Hai lasciato la linea teorica: <b>stai esplorando per conto tuo</b>.
                  <div className="riga-tasti">
                    <button type="button" className="tasto" onClick={linea.ripristina}>Torna alla linea</button>
                  </div>
                </div>
              )}
              <div className="linea-principale" style={{ marginTop: 16 }}>
                {linea.mosse.map((m, i) => (
                  <React.Fragment key={i}>
                    {i % 2 === 0 && <span className="num">{i / 2 + 1}.</span>}
                    <button type="button" aria-current={linea.ply === i + 1} onClick={() => linea.setPly(i + 1)}>{m}</button>
                  </React.Fragment>
                ))}
              </div>
            </div>

            <div>
              {mostraInsidia && apertura.insidia ? (
                <div className="pannello">
                  <h3>{apertura.insidia.nome}</h3>
                  <p>{apertura.insidia.testo}</p>
                </div>
              ) : (
                <div className="pannello">
                  <h3>L&#8217;idea</h3>
                  <p>{apertura.idea}</p>
                  <dl className="piani">
                    <dt>Piano del bianco</dt>
                    <dd>{apertura.bianco}</dd>
                    <dt>Piano del nero</dt>
                    <dd>{apertura.nero}</dd>
                  </dl>
                </div>
              )}
              <PannelloMotore fen={linea.posizione.fen()} automatico={false} onGioca={(san) => linea.gioca(san)} />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   APP
   ================================================================ */

function App() {
  const [sezione, setSezione] = useState('partite');
  const primo = useRef(true);

  const schede = [
    { id: 'partite', nome: 'Partite' },
    { id: 'analisi', nome: 'Analisi' },
    { id: 'aperture', nome: 'Aperture' }
  ];

  return (
    <div className="guscio">
      <header className="testata">
        <div className="marchio">
          <h1>Sessantaquattro</h1>
          <p>Le partite che hanno fatto la storia, una scacchiera per provarci sopra le tue mosse e una libreria di aperture.</p>
        </div>
        <nav className="navigazione">
          {schede.map((s) => (
            <button key={s.id} type="button" aria-current={sezione === s.id} onClick={() => setSezione(s.id)}>{s.nome}</button>
          ))}
        </nav>
      </header>

      {sezione === 'partite' && <SezionePartite primoAvvio={primo.current} consumaPrimoAvvio={() => { primo.current = false; }} />}
      {sezione === 'analisi' && <SezioneAnalisi />}
      {sezione === 'aperture' && <SezioneAperture />}

      <footer className="piede">
        Le mosse delle partite storiche sono state verificate una per una. Le valutazioni arrivano da Stockfish
        compilato per il browser: girano sul tuo computer, non su un server, e non costano nulla. Se il motore non
        riesce a scaricarsi, l&#8217;analisi passa a un motore interno più semplice e il sito continua a funzionare.
      </footer>
    </div>
  );
}

if (typeof Chess === 'undefined' || typeof ReactDOM === 'undefined') {
  document.getElementById('root').innerHTML =
    '<div style="padding:60px 20px;max-width:640px;margin:0 auto;font-family:Karla,sans-serif">' +
    '<h1 style="font-family:Bodoni Moda,serif;font-weight:500">Manca una libreria</h1>' +
    '<p>Una delle librerie che servono al sito non si è caricata. ' +
    'Controlla la connessione e ricarica la pagina.</p></div>';
} else {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
