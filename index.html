<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sessantaquattro — partite, aperture, medio gioco e finali</title>
<meta name="description" content="Le partite più famose della storia degli scacchi, una scacchiera con motore di analisi, una libreria di aperture e allenamenti su medio gioco e finali.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Karla:ital,wght@0,300..700;1,300..600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root{
  --ebano:#17120E;
  --tavolo:#211A14;
  --tavolo-alto:#2B231B;
  --linea:#3B2E23;
  --avorio:#F1E7D3;
  --smorzato:#A2917A;
  --ottone:#C79333;
  --ottone-scuro:#8A6520;
  --bosso:#E3D2AE;
  --palissandro:#8A6340;
  --verde:#7A9459;
  --rosso:#B0543F;
  --display:"Bodoni Moda",Georgia,serif;
  --testo:"Karla",system-ui,-apple-system,sans-serif;
  --nota:"IBM Plex Mono",ui-monospace,monospace;
  --simboli:"Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ebano);
  color:var(--avorio);
  font-family:var(--testo);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ottone);outline-offset:2px;border-radius:2px}

/* ---------- impalcatura ---------- */
.guscio{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.testata{padding:calc(30px + env(safe-area-inset-top,0px)) 0 20px}
.marchio{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.marchio h1{
  font-family:var(--display);
  font-weight:500;
  font-size:clamp(30px,5.4vw,46px);
  letter-spacing:-.012em;
  margin:0;
  line-height:1;
}
.marchio p{margin:0;color:var(--smorzato);font-size:15px;max-width:46ch}
.navigazione{
  display:flex;gap:6px;flex-wrap:wrap;
  position:sticky;top:0;z-index:30;
  background:var(--ebano);
  padding:12px 0;
  border-bottom:1px solid var(--linea);
}
.navigazione button{
  background:none;border:1px solid transparent;border-radius:999px;
  padding:7px 17px;color:var(--smorzato);letter-spacing:.01em;
}
.navigazione button:hover{color:var(--avorio)}
.navigazione button[aria-current="true"]{
  color:var(--ebano);background:var(--ottone);border-color:var(--ottone);font-weight:600;
}
.sezione{padding-top:30px}

/* ---------- griglia principale ---------- */
.tavola{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:34px;align-items:start}
.colonna-stretta{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:34px;align-items:start}
@media(max-width:880px){
  .tavola,.colonna-stretta{grid-template-columns:minmax(0,1fr);gap:26px}
  .guscio{padding:0 13px 60px}
  /* la scacchiera per prima: l'elenco delle partite occuperebbe tutto lo schermo */
  .colonna-stretta > .centro{order:1}
  .colonna-stretta > .lato{order:2}
  .lato .elenco{max-height:none}
  .testata{padding-bottom:14px}
  .marchio h1{font-size:30px}
}

/* ---------- scacchiera ---------- */
.scacchiera-guscio{max-width:560px}
.scacchiera-guscio.con-barra{max-width:582px}
.scacchiera-riga{display:flex;gap:8px;align-items:stretch}
.scacchiera-riga .scacchiera{flex:1;min-width:0}
.barra-verticale{
  flex:none;width:14px;display:flex;flex-direction:column-reverse;
  background:#2A211A;border:1px solid #0D0906;border-radius:2px;overflow:hidden;
}
.barra-verticale.capovolta{flex-direction:column}
.barra-verticale i{display:block;width:100%;background:var(--bosso);transition:height .35s ease}
.barra-verticale.spenta{opacity:.35}
/* ---------- striscia del motore sotto la scacchiera ---------- */
.striscia{margin-top:12px;max-width:582px;background:var(--tavolo);border:1px solid var(--linea);border-radius:6px;padding:10px 14px}
.striscia-lato{margin-top:0;margin-bottom:18px;max-width:none}
@media(min-width:881px){.striscia-sotto{display:none}}
@media(max-width:880px){.striscia-lato{display:none}}
.striscia-riga{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.striscia .cifra{font-family:var(--nota);font-size:21px;font-weight:600;letter-spacing:-.02em;min-width:66px}
.striscia .cifra.n{color:var(--smorzato)}
.striscia-migliore{font-family:var(--nota);font-size:13px;color:var(--smorzato)}
.striscia-migliore b{color:var(--ottone);font-size:17px;font-weight:600;margin-left:3px}
.striscia-testo{font-size:14px;color:var(--smorzato)}
.striscia .spazio{flex:1}
.tasto.piccolo{padding:4px 11px;font-size:13px}
.striscia-linea{margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.striscia-piede{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
.striscia-piede .spia{margin-top:0}
.striscia-piede label{font-family:var(--nota);font-size:11.5px;color:var(--smorzato);display:flex;align-items:center;gap:8px}
.striscia-piede input[type=range]{width:110px;accent-color:var(--ottone)}
.scacchiera{
  display:grid;
  /* Servono anche le righe: senza, le traverse con i pezzi diventano più alte
     di quelle vuote perché la griglia le dimensiona sul contenuto. */
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));
  aspect-ratio:1/1;width:100%;
  border:1px solid #0D0906;
  box-shadow:0 18px 44px rgba(0,0,0,.45);
  user-select:none;touch-action:manipulation;
}
.casa{
  position:relative;display:flex;align-items:center;justify-content:center;
  border:0;padding:0;min-width:0;min-height:0;
  background-color:var(--sq-chiara);background-image:var(--sq-trama-chiara);
  container-type:size;
}
.casa.scura{background-color:var(--sq-scura);background-image:var(--sq-trama-scura)}
.casa.cliccabile{cursor:pointer}
.casa.ultima::after{content:"";position:absolute;inset:0;background:rgba(199,147,51,.34)}
.casa.selezionata::after{content:"";position:absolute;inset:0;background:rgba(199,147,51,.52)}
.casa.scacco::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(176,84,63,.9),rgba(176,84,63,0) 72%)}
.pezzo{
  position:relative;z-index:2;
  font-family:var(--simboli);
  line-height:1;
  pointer-events:none;
  font-size:min(8.6vw,50px);   /* riserva per browser senza container query */
  font-size:74cqmin;           /* proporzionale alla casa, non allo schermo */
}
.pezzo.b{color:#FBF6EA;-webkit-text-stroke:1.2px #241C15;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.pezzo.n{color:#231B14;-webkit-text-stroke:1.2px #0B0705}
.bersaglio{position:absolute;z-index:3;width:26%;height:26%;border-radius:50%;background:rgba(23,18,14,.34)}
.bersaglio.presa{width:86%;height:86%;border-radius:50%;background:none;box-shadow:inset 0 0 0 4px rgba(23,18,14,.34)}
.coordinata{position:absolute;font-family:var(--nota);font-size:9px;opacity:.62;z-index:4}
.coordinata.col{right:3px;bottom:1px}
.coordinata.rig{left:3px;top:1px}
.casa .coordinata{color:var(--coord-chiara)}
.casa.scura .coordinata{color:var(--coord-scura)}

/* ---------- pattern della scacchiera ---------- */
:root,[data-scacchiera="legno"]{
  --sq-chiara:#E3D2AE;--sq-scura:#8A6340;
  --sq-trama-chiara:repeating-linear-gradient(92deg,rgba(139,99,58,.11) 0 1px,transparent 1px 7px);
  --sq-trama-scura:repeating-linear-gradient(92deg,rgba(40,22,10,.17) 0 1px,transparent 1px 6px);
  --coord-chiara:#2A2119;--coord-scura:#EBDCBC;
}
[data-scacchiera="torneo"]{
  --sq-chiara:#EDE6D0;--sq-scura:#6E8A5A;
  --sq-trama-chiara:none;--sq-trama-scura:none;
  --coord-chiara:#2A2119;--coord-scura:#EAF0E2;
}
[data-scacchiera="marmo"]{
  --sq-chiara:#E9E7E2;--sq-scura:#7C8189;
  --sq-trama-chiara:radial-gradient(130% 95% at 22% 12%,rgba(110,112,122,.20),transparent 62%);
  --sq-trama-scura:radial-gradient(130% 95% at 76% 22%,rgba(255,255,255,.20),transparent 64%);
  --coord-chiara:#33363B;--coord-scura:#EDEFF2;
}
[data-scacchiera="diagramma"]{
  --sq-chiara:#F5F0E3;--sq-scura:#F5F0E3;
  --sq-trama-chiara:none;
  --sq-trama-scura:repeating-linear-gradient(45deg,rgba(35,27,20,.44) 0 1.5px,transparent 1.5px 6px);
  --coord-chiara:#2A2119;--coord-scura:#2A2119;
}
[data-scacchiera="diagramma"] .casa{box-shadow:inset 0 0 0 1px rgba(35,27,20,.22)}
[data-scacchiera="diagramma"] .pezzo.n{color:#1C1612;-webkit-text-stroke:1.2px #F5F0E3}
[data-scacchiera="notte"]{
  --sq-chiara:#D6DDE6;--sq-scura:#4A6483;
  --sq-trama-chiara:none;--sq-trama-scura:none;
  --coord-chiara:#252E38;--coord-scura:#DCE5EF;
}

.temi{display:flex;align-items:center;gap:7px;margin-top:12px;flex-wrap:wrap}
.temi .etichetta-temi{font-family:var(--nota);font-size:12px;color:var(--smorzato);margin-right:2px}
.campione{
  width:28px;height:28px;border-radius:3px;padding:0;
  border:1px solid var(--linea);
  background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%);
}
.campione:hover{border-color:var(--ottone-scuro)}
.campione[aria-current="true"]{border-color:var(--ottone);box-shadow:0 0 0 2px rgba(199,147,51,.32)}
.campione[data-tema="legno"]{--c1:#E3D2AE;--c2:#8A6340}
.campione[data-tema="torneo"]{--c1:#EDE6D0;--c2:#6E8A5A}
.campione[data-tema="marmo"]{--c1:#E9E7E2;--c2:#7C8189}
.campione[data-tema="diagramma"]{--c1:#F5F0E3;--c2:#F5F0E3;background-image:linear-gradient(135deg,#F5F0E3 0 50%,transparent 50%),repeating-linear-gradient(45deg,rgba(35,27,20,.44) 0 1.5px,transparent 1.5px 6px);background-color:#F5F0E3}
.campione[data-tema="notte"]{--c1:#D6DDE6;--c2:#4A6483}

/* ---------- controlli ---------- */
.controlli{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.tasto{
  background:var(--tavolo-alto);border:1px solid var(--linea);border-radius:4px;
  padding:7px 13px;color:var(--avorio);font-size:14px;
}
.tasto:hover:not(:disabled){border-color:var(--ottone);color:var(--ottone)}
.tasto:disabled{opacity:.36;cursor:not-allowed}
.tasto.pieno{background:var(--ottone);border-color:var(--ottone);color:#1A1309;font-weight:600}
.tasto.pieno:hover{background:#D6A343;border-color:#D6A343;color:#1A1309}
.tasto.nav{font-family:var(--nota);min-width:44px;text-align:center}
.riga-tasti{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ---------- pannelli ---------- */
.pannello{background:var(--tavolo);border:1px solid var(--linea);border-radius:6px;padding:20px}
.pannello + .pannello{margin-top:18px}
.pannello h3{
  font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 10px;letter-spacing:-.01em;
}
.pannello p{margin:0 0 10px;font-size:15px;color:#DCD0BB}
.pannello p:last-child{margin-bottom:0}

/* ---------- elenco partite ---------- */
.elenco{display:flex;flex-direction:column;gap:2px;max-height:none}
.voce{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-left:2px solid var(--linea);padding:11px 14px;color:var(--smorzato);
}
.voce:hover{border-left-color:var(--ottone-scuro);color:var(--avorio);background:rgba(255,255,255,.02)}
.voce[aria-current="true"]{border-left-color:var(--ottone);background:var(--tavolo);color:var(--avorio)}
.voce .vt{font-family:var(--display);font-size:17px;font-weight:600;display:block;line-height:1.25}
.voce .vs{font-size:13px;color:var(--smorzato);display:block;margin-top:2px}

/* ---------- intestazione partita ---------- */
.intestazione{margin-bottom:18px}
.intestazione h2{
  font-family:var(--display);font-weight:500;font-size:clamp(26px,4.2vw,38px);
  margin:0 0 6px;line-height:1.08;letter-spacing:-.015em;
}
.giocatori{font-family:var(--nota);font-size:13.5px;color:var(--smorzato);margin:0}
.giocatori b{color:var(--avorio);font-weight:500}
.occhiello{font-family:var(--display);font-style:italic;font-size:18px;color:var(--ottone);margin:10px 0 0;max-width:56ch}

/* ---------- lista mosse ---------- */
.mosse{font-family:var(--nota);font-size:14px;max-height:320px;overflow-y:auto;padding-right:4px}
.mossa-riga{display:grid;grid-template-columns:34px 1fr 1fr;gap:2px;align-items:center}
.mossa-riga .num{color:var(--smorzato);font-size:12.5px;text-align:right;padding-right:8px}
.mosse button{
  background:none;border:0;text-align:left;padding:3px 7px;border-radius:3px;color:#DCD0BB;
  font-family:var(--nota);font-size:14px;width:100%;
}
.mosse button:hover{background:rgba(255,255,255,.05);color:var(--avorio)}
.mosse button[aria-current="true"]{background:var(--ottone);color:#1A1309;font-weight:600}
.mosse button.var{color:var(--ottone)}
.mosse button.var[aria-current="true"]{background:var(--ottone);color:#1A1309}

/* ---------- nota alla mossa ---------- */
.nota{
  border-left:2px solid var(--ottone);padding:2px 0 2px 15px;margin-top:16px;
  font-size:15.5px;color:#E6DAC4;min-height:1.5em;
}
.nota .etichetta{font-family:var(--nota);font-size:12px;color:var(--ottone);display:block;margin-bottom:3px}

/* ---------- motore ---------- */
.barra{height:9px;background:#2A211A;border:1px solid var(--linea);border-radius:2px;overflow:hidden;display:flex}
.barra i{display:block;background:var(--bosso);height:100%;transition:width .35s ease}
.valutazione{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.valutazione .cifra{font-family:var(--nota);font-size:26px;font-weight:600;letter-spacing:-.02em}
.valutazione .cifra.n{color:var(--smorzato)}
.dettaglio{font-family:var(--nota);font-size:12.5px;color:var(--smorzato);margin-top:9px;line-height:1.55;word-break:break-word}
.dettaglio b{color:var(--avorio);font-weight:500}
.migliore{font-family:var(--nota);font-size:18px;color:var(--ottone);font-weight:600}
.campo{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--smorzato);flex-wrap:wrap}
.campo input[type=range]{flex:1;min-width:110px;accent-color:var(--ottone)}
.campo select{
  background:var(--tavolo-alto);color:var(--avorio);border:1px solid var(--linea);
  border-radius:4px;padding:5px 8px;font-family:inherit;font-size:14px;
}
.spia{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--nota);font-size:11.5px;
  color:var(--smorzato);margin-top:14px;
}
.spia i{width:6px;height:6px;border-radius:50%;background:var(--verde);display:block}
.spia i.attesa{background:var(--ottone)}
.spia i.locale{background:var(--palissandro)}

/* ---------- avvisi ---------- */
.avviso{
  border:1px solid var(--ottone-scuro);background:rgba(199,147,51,.09);
  border-radius:5px;padding:11px 15px;font-size:14.5px;margin-top:14px;color:#E9DCC2;
}
.avviso b{color:var(--ottone)}
.esito{font-family:var(--nota);font-size:13px;color:var(--ottone);margin-top:10px}

/* ---------- aperture ---------- */
.griglia-aperture{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:2px}
.famiglia{font-family:var(--nota);font-size:12px;color:var(--ottone);margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--linea)}
.famiglia:first-child{margin-top:0}
.eco{font-family:var(--nota);font-size:12px;color:var(--smorzato)}
.linea-principale{font-family:var(--nota);font-size:14px;color:#DCD0BB;line-height:2}
.linea-principale button{
  background:none;border:0;color:inherit;font-family:var(--nota);font-size:14px;
  padding:2px 5px;border-radius:3px;
}
.linea-principale button:hover{background:rgba(255,255,255,.05)}
.linea-principale button[aria-current="true"]{background:var(--ottone);color:#1A1309;font-weight:600}
.linea-principale .num{color:var(--smorzato);margin-left:5px}
dl.piani{margin:0}
dl.piani dt{font-family:var(--nota);font-size:12px;color:var(--ottone);margin-top:13px}
dl.piani dd{margin:3px 0 0;font-size:15px;color:#DCD0BB}

/* ---------- promozione ---------- */
.velo{position:fixed;inset:0;background:rgba(10,7,5,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dialogo{background:var(--tavolo);border:1px solid var(--linea);border-radius:6px;padding:24px;max-width:340px;text-align:center}
.dialogo h3{font-family:var(--display);margin:0 0 14px;font-size:20px}
.scelte{display:flex;gap:8px;justify-content:center}
.scelte button{
  width:60px;height:60px;background:var(--bosso);border:1px solid var(--linea);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
}
.scelte button:hover{border-color:var(--ottone)}
.scelte .pezzo{font-size:38px}

.piede{margin-top:60px;padding-top:22px;border-top:1px solid var(--linea);color:var(--smorzato);font-size:13.5px;max-width:70ch}
.piede a{color:var(--ottone)}

/* ---------- allenamenti ---------- */
.avviso.riuscito{border-color:var(--verde);background:rgba(122,148,89,.13)}
.avviso.riuscito b{color:#B5CC8E}
.avviso.errore{border-color:var(--rosso);background:rgba(176,84,63,.12)}
.avviso.errore b{color:#E39A86}
.voce .fatto{color:var(--verde);font-family:var(--testo);font-size:15px}
.lato > div + div .famiglia{margin-top:22px}
.commutatore{display:inline-flex;gap:3px;margin-top:26px;padding:3px;border:1px solid var(--linea);border-radius:999px;vertical-align:middle}
.commutatore button{background:none;border:0;border-radius:999px;padding:6px 18px;color:var(--smorzato);font-size:14px}
.commutatore button:hover{color:var(--avorio)}
.commutatore button[aria-pressed="true"]{background:var(--tavolo-alto);color:var(--avorio);font-weight:600;box-shadow:inset 0 0 0 1px var(--ottone-scuro)}
.spiega-modo{display:inline-block;margin:26px 0 0 14px;font-size:14px;color:var(--smorzato);vertical-align:middle}
.spiega-modo + .sezione{padding-top:22px}
.scelte-piano{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.scelta-piano{
  text-align:left;background:var(--tavolo-alto);border:1px solid var(--linea);border-radius:5px;
  padding:11px 14px;color:var(--avorio);font-size:15px;line-height:1.45;
}
.scelta-piano:hover:not(:disabled){border-color:var(--ottone)}
.scelta-piano:disabled{cursor:default}
.scelta-piano.giusta{border-color:var(--verde);background:rgba(122,148,89,.14)}
.scelta-piano.sbagliata{border-color:var(--rosso);color:var(--smorzato)}
.pannello p.commento{font-size:14px;margin:0 0 4px 12px;padding-left:12px;border-left:2px solid var(--linea)}
.pannello p.commento.giusta{border-left-color:var(--verde)}
.pannello p.commento.sbagliata{border-left-color:var(--rosso)}
.commento.giusta b{color:#B5CC8E}
.commento.sbagliata b{color:#E39A86}
@media(max-width:880px){.spiega-modo{display:block;margin:10px 0 0}}
.conteggio{font-family:var(--nota);font-size:12px;color:var(--smorzato);margin:0 0 14px}
.mossa-finale{padding:2px 5px;color:var(--smorzato)}
.mossa-finale.mia{color:var(--avorio)}

const PARSER_STRICT = 0
const PARSER_SLOPPY = 1

/* this function is used to uniquely identify ambiguous moves */
function get_disambiguator(move, moves) {
  var from = move.from
  var to = move.to
  var piece = move.piece

  var ambiguities = 0
  var same_rank = 0
  var same_file = 0

  for (var i = 0, len = moves.length; i < len; i++) {
    var ambig_from = moves[i].from
    var ambig_to = moves[i].to
    var ambig_piece = moves[i].piece

    /* if a move of the same piece type ends on the same to square, we'll
     * need to add a disambiguator to the algebraic notation
     */
    if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
      ambiguities++

      if (rank(from) === rank(ambig_from)) {
        same_rank++
      }

      if (file(from) === file(ambig_from)) {
        same_file++
      }
    }
  }

  if (ambiguities > 0) {
    /* if there exists a similar moving piece on the same rank and file as
     * the move in question, use the square as the disambiguator
     */
    if (same_rank > 0 && same_file > 0) {
      return algebraic(from)
    } else if (same_file > 0) {
      /* if the moving piece rests on the same file, use the rank symbol as the
       * disambiguator
       */
      return algebraic(from).charAt(1)
    } else {
      /* else use the file symbol */
      return algebraic(from).charAt(0)
    }
  }

  return ''
}

function infer_piece_type(san) {
  var piece_type = san.charAt(0)
  if (piece_type >= 'a' && piece_type <= 'h') {
    var matches = san.match(/[a-h]\d.*[a-h]\d/)
    if (matches) {
      return undefined
    }
    return PAWN
  }
  piece_type = piece_type.toLowerCase()
  if (piece_type === 'o') {
    return KING
  }
  return piece_type
}

// parses all of the decorators out of a SAN string
function stripped_san(move) {
  return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
}

/*****************************************************************************
 * UTILITY FUNCTIONS
 ****************************************************************************/
function rank(i) {
  return i >> 4
}

function file(i) {
  return i & 15
}

function algebraic(i) {
  var f = file(i),
    r = rank(i)
  return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
}

function swap_color(c) {
  return c === WHITE ? BLACK : WHITE
}

function is_digit(c) {
  return '0123456789'.indexOf(c) !== -1
}

function clone(obj) {
  var dupe = obj instanceof Array ? [] : {}

  for (var property in obj) {
    if (typeof property === 'object') {
      dupe[property] = clone(obj[property])
    } else {
      dupe[property] = obj[property]
    }
  }

  return dupe
}

function trim(str) {
  return str.replace(/^\s+|\s+$/g, '')
}

/***************************************************************************
 * PUBLIC CONSTANTS

var BLACK = 'b'
var WHITE = 'w'

var EMPTY = -1

var PAWN = 'p'
var KNIGHT = 'n'
var BISHOP = 'b'
var ROOK = 'r'
var QUEEN = 'q'
var KING = 'k'

var SQUARES = (function () {
  /* from the ECMA-262 spec (section 12.6.4):
   * "The mechanics of enumerating the properties ... is
   * implementation dependent"
   * so: for (var sq in SQUARES) { keys.push(sq); } might not be
   * ordered correctly
   */
  var keys = []
  for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
    if (i & 0x88) {
      i += 7
      continue
    }
    keys.push(algebraic(i))
  }
  return keys
})()

var FLAGS = {
  NORMAL: 'n',
  CAPTURE: 'c',
  BIG_PAWN: 'b',
  EP_CAPTURE: 'e',
  PROMOTION: 'p',
  KSIDE_CASTLE: 'k',
  QSIDE_CASTLE: 'q',
}

var Chess = function (fen) {
  var board = new Array(128)
  var kings = { w: EMPTY, b: EMPTY }
  var turn = WHITE
  var castling = { w: 0, b: 0 }
  var ep_square = EMPTY
  var half_moves = 0
  var move_number = 1
  var history = []
  var header = {}
  var comments = {}

  /* if the user passes in a fen string, load it, else default to
   * starting position
   */
  if (typeof fen === 'undefined') {
    load(DEFAULT_POSITION)
  } else {
    load(fen)
  }

  function clear(keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    board = new Array(128)
    kings = { w: EMPTY, b: EMPTY }
    turn = WHITE
    castling = { w: 0, b: 0 }
    ep_square = EMPTY
    half_moves = 0
    move_number = 1
    history = []
    if (!keep_headers) header = {}
    comments = {}
    update_setup(generate_fen())
  }

  function prune_comments() {
    var reversed_history = []
    var current_comments = {}
    var copy_comment = function (fen) {
      if (fen in comments) {
        current_comments[fen] = comments[fen]
      }
    }
    while (history.length > 0) {
      reversed_history.push(undo_move())
    }
    copy_comment(generate_fen())
    while (reversed_history.length > 0) {
      make_move(reversed_history.pop())
      copy_comment(generate_fen())
    }
    comments = current_comments
  }

  function reset() {
    load(DEFAULT_POSITION)
  }

  function load(fen, keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    var tokens = fen.split(/\s+/)
    var position = tokens[0]
    var square = 0

    if (!validate_fen(fen).valid) {
      return false
    }

    clear(keep_headers)

    for (var i = 0; i < position.length; i++) {
      var piece = position.charAt(i)

      if (piece === '/') {
        square += 8
      } else if (is_digit(piece)) {
        square += parseInt(piece, 10)
      } else {
        var color = piece < 'a' ? WHITE : BLACK
        put({ type: piece.toLowerCase(), color: color }, algebraic(square))
        square++
      }
    }

    turn = tokens[1]

    if (tokens[2].indexOf('K') > -1) {
      castling.w |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('Q') > -1) {
      castling.w |= BITS.QSIDE_CASTLE
    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    ep_square = tokens[3] === '-' ? EMPTY : SQUARE_MAP[tokens[3]]
    half_moves = parseInt(tokens[4], 10)
    move_number = parseInt(tokens[5], 10)

    update_setup(generate_fen())

    return true
  }

  /* TODO: this function is pretty much crap - it validates structure but
   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while
   * we're at it
   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square',
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(parseInt(tokens[5])) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(parseInt(tokens[4])) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARE_MAP.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARE_MAP[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARE_MAP)) {
      return false
    }

    var sq = SQUARE_MAP[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARE_MAP[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type,
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARE_MAP.a8
    var last_sq = SQUARE_MAP.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    var piece_type =
      typeof options !== 'undefined' &&
      'piece' in options &&
      typeof options.piece === 'string'
        ? options.piece.toLowerCase()
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARE_MAP) {
        first_sq = last_sq = SQUARE_MAP[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN && (piece_type === true || piece_type === PAWN)) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else if (piece_type === true || piece_type === piece.type) {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (piece_type === true || piece_type === KING) {
      if (!single_square || last_sq === kings[us]) {
        /* king-side castling */
        if (castling[us] & BITS.KSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from + 2

          if (
            board[castling_from + 1] == null &&
            board[castling_to] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from + 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
          }
        }

        /* queen-side castling */
        if (castling[us] & BITS.QSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from - 2

          if (
            board[castling_from - 1] == null &&
            board[castling_from - 2] == null &&
            board[castling_from - 3] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from - 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
          }
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, moves) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      if (move.piece !== PAWN) {
        var disambiguator = get_disambiguator(move, moves)
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  function attacked(color, square) {
    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen().split(' ').slice(0, 4).join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number,
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?! becomes Nf3
    var clean_move = stripped_san(move)

    // the move parsers is a 2-step state
    for (var parser = 0; parser < 2; parser++) {
      if (parser == PARSER_SLOPPY) {
        // only run the sloppy parse if explicitly requested
        if (!sloppy) {
          return null
        }

        // The sloppy parser allows the user to parse non-standard chess
        // notations. This parser is opt-in (by specifying the
        // '{ sloppy: true }' setting) and is only run after the Standard
        // Algebraic Notation (SAN) parser has failed.
        //
        // When running the sloppy parser, we'll run a regex to grab the piece,
        // the to/from square, and an optional promotion piece. This regex will
        // parse common non-standard notation like: Pe2-e4, Rc1c4, Qf3xf7,
        // f7f8q, b1c3

        // NOTE: Some positions and moves may be ambiguous when using the
        // sloppy parser. For example, in this position:
        // 6k1/8/8/B7/8/8/8/BN4K1 w - - 0 1, the move b1c3 may be interpreted
        // as Nc3 or B1c3 (a disambiguated bishop move). In these cases, the
        // sloppy parser will default to the most most basic interpretation
        // (which is b1c3 parsing to Nc3).

        // FIXME: these var's are hoisted into function scope, this will need
        // to change when switching to const/let

        var overly_disambiguated = false

        var matches = clean_move.match(
          /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
        )
        if (matches) {
          var piece = matches[1]
          var from = matches[2]
          var to = matches[3]
          var promotion = matches[4]

          if (from.length == 1) {
            overly_disambiguated = true
          }
        } else {
          // The [a-h]?[1-8]? portion of the regex below handles moves that may
          // be overly disambiguated (e.g. Nge7 is unnecessary and non-standard
          // when there is one legal knight move to e7). In this case, the value
          // of 'from' variable will be a rank or file, not a square.
          var matches = clean_move.match(
            /([pnbrqkPNBRQK])?([a-h]?[1-8]?)x?-?([a-h][1-8])([qrbnQRBN])?/
          )

          if (matches) {
            var piece = matches[1]
            var from = matches[2]
            var to = matches[3]
            var promotion = matches[4]

            if (from.length == 1) {
              var overly_disambiguated = true
            }
          }
        }
      }

      var piece_type = infer_piece_type(clean_move)
      var moves = generate_moves({
        legal: true,
        piece: piece ? piece : piece_type,
      })

      for (var i = 0, len = moves.length; i < len; i++) {
        switch (parser) {
          case PARSER_STRICT: {
            if (clean_move === stripped_san(move_to_san(moves[i], moves))) {
              return moves[i]
            }
            break
          }
          case PARSER_SLOPPY: {
            if (matches) {
              // hand-compare move properties with the results from our sloppy
              // regex
              if (
                (!piece || piece.toLowerCase() == moves[i].piece) &&
                SQUARE_MAP[from] == moves[i].from &&
                SQUARE_MAP[to] == moves[i].to &&
                (!promotion || promotion.toLowerCase() == moves[i].promotion)
              ) {
                return moves[i]
              } else if (overly_disambiguated) {
                // SPECIAL CASE: we parsed a move string that may have an
                // unneeded rank/file disambiguator (e.g. Nge7).  The 'from'
                // variable will
                var square = algebraic(moves[i].from)
                if (
                  (!piece || piece.toLowerCase() == moves[i].piece) &&
                  SQUARE_MAP[to] == moves[i].to &&
                  (from == square[0] || from == square[1]) &&
                  (!promotion || promotion.toLowerCase() == moves[i].promotion)
                ) {
                  return moves[i]
                }
              }
            }
          }
        }
      }
    }

    return null
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, generate_moves({ legal: true }))
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function (fen) {
      return load(fen)
    },

    reset: function () {
      return reset()
    },

    moves: function (options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(
            move_to_san(ugly_moves[i], generate_moves({ legal: true }))
          )
        }
      }

      return moves
    },

    in_check: function () {
      return in_check()
    },

    in_checkmate: function () {
      return in_checkmate()
    },

    in_stalemate: function () {
      return in_stalemate()
    },

    in_draw: function () {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function () {
      return insufficient_material()
    },

    in_threefold_repetition: function () {
      return in_threefold_repetition()
    },

    game_over: function () {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function (fen) {
      return validate_fen(fen)
    },

    fen: function () {
      return generate_fen()
    },

    board: function () {
      var output = [],
        row = []

      for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({
            square: algebraic(i),
            type: board[i].type,
            color: board[i].color,
          })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    pgn: function (options) {
      /* using the specification from http://www.chessclub.com/help/PGN-spec
       * example for html usage: .pgn({ max_width: 72, newline_char: "<br />" })
       */
      var newline =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\n'
      var max_width =
        typeof options === 'object' && typeof options.max_width === 'number'
          ? options.max_width
          : 0
      var result = []
      var header_exists = false

      /* add the PGN header information */
      for (var i in header) {
        /* TODO: order of enumerated properties in header object is not
         * guaranteed, see ECMA-262 spec (section 12.6.4)
         */
        result.push('[' + i + ' "' + header[i] + '"]' + newline)
        header_exists = true
      }

      if (header_exists && history.length) {
        result.push(newline)
      }

      var append_comment = function (move_string) {
        var comment = comments[generate_fen()]
        if (typeof comment !== 'undefined') {
          var delimiter = move_string.length > 0 ? ' ' : ''
          move_string = `${move_string}${delimiter}{${comment}}`
        }
        return move_string
      }

      /* pop all of history onto reversed_history */
      var reversed_history = []
      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      var moves = []
      var move_string = ''

      /* special case of a commented starting position with no moves */
      if (reversed_history.length === 0) {
        moves.push(append_comment(''))
      }

      /* build the list of moves.  a move_string looks like: "3. e3 e6" */
      while (reversed_history.length > 0) {
        move_string = append_comment(move_string)
        var move = reversed_history.pop()

        /* if the position started with black to move, start PGN with #. ... */
        if (!history.length && move.color === 'b') {
          const prefix = `${move_number}. ...`
          /* is there a comment preceding the first move? */
          move_string = move_string ? `${move_string} ${prefix}` : prefix
        } else if (move.color === 'w') {
          /* store the previous generated move_string if we have one */
          if (move_string.length) {
            moves.push(move_string)
          }
          move_string = move_number + '.'
        }

        move_string =
          move_string + ' ' + move_to_san(move, generate_moves({ legal: true }))
        make_move(move)
      }

      /* are there any other leftover moves? */
      if (move_string.length) {
        moves.push(append_comment(move_string))
      }

      /* is there a result? */
      if (typeof header.Result !== 'undefined') {
        moves.push(header.Result)
      }

      /* history should be back to what it was before we started generating PGN,
       * so join together moves
       */
      if (max_width === 0) {
        return result.join('') + moves.join(' ')
      }

      var strip = function () {
        if (result.length > 0 && result[result.length - 1] === ' ') {
          result.pop()
          return true
        }
        return false
      }

      /* NB: this does not preserve comment whitespace. */
      var wrap_comment = function (width, move) {

      /* wrap the PGN output at max_width */
      var current_width = 0
      for (var i = 0; i < moves.length; i++) {
        if (current_width + moves[i].length > max_width) {
          if (moves[i].includes('{')) {
            current_width = wrap_comment(current_width, moves[i])

        if (current_width + moves[i].length > max_width && i !== 0) {
          /* don't end the line with whitespace */

            result.pop()

        result.push(moves[i])

    load_pgn: function (pgn, options) {
      // allow the user to specify the sloppy move parser to work around over

      var newline_char =

          ? options.newline_char

      // RegExp to split header. Takes advantage of the fact that header and movetext

      // With default newline_char, will equal: /^(\[((?:\r?\n)|.)*\])(?:\s*\r?\n){2}/

          mask(newline_char) +

        ? header_regex.exec(pgn)[1]

      /* parse PGN header */
      var headers = parse_pgn_header(header_string, options)
      var fen = ''

      for (var key in headers) {
        // check to see user is including fen (possibly with wrong tag case)
        if (key.toLowerCase() === 'fen') {
          fen = headers[key]
        }
        set_header([key, headers[key]])

      /* sloppy parser should attempt to load a fen tag, even if it's
       * the wrong case and doesn't include a corresponding [SetUp "1"] tag */

        if (fen) {
          if (!load(fen, true)) {
            return false
          }
        }
      } else {
        /* strict parser - load the starting position indicated by [Setup '1']
         * and [FEN position] */
        if (headers['SetUp'] === '1') {
          if (!('FEN' in headers && load(headers['FEN'], true))) {
            // second argument to load: don't clear the headers
            return false

        }
      }

      /* NB: the regexes below that delete move numbers, recursive
       * annotations, and numeric annotation glyphs may also match
       * text in comments. To prevent this, we transform comments
       * by hex-encoding them in place and decoding them again after
       * the other tokens have been deleted.

       * we use {en,de}codeURIComponent here to support arbitrary UTF8

        return Array.from(string)
          .map(function (c) {
            /* encodeURI doesn't transform most ASCII characters,
             * so we handle these ourselves */

              ? c.charCodeAt(0).toString(16)
              : encodeURIComponent(c).replace(/\%/g, '').toLowerCase()

        return string.length == 0
          ? ''
          : decodeURIComponent('%' + string.match(/.{1,2}/g).join('%'))

      var encode_comment = function (string) {
        string = string.replace(new RegExp(mask(newline_char), 'g'), ' ')

      var decode_comment = function (string) {
        if (string.startsWith('{') && string.endsWith('}')) {
          return from_hex(string.slice(1, string.length - 1))

        .replace(header_string, '')

          /* encode comments so they don't get deleted below */

      for (var half_move = 0; half_move < moves.length; half_move++) {
        var comment = decode_comment(moves[half_move])
        if (comment !== undefined) {
          comments[generate_fen()] = comment
          continue
        }

        move = move_from_san(moves[half_move], sloppy)

        /* invalid move */
        if (move == null) {
          /* was the move an end of game marker */

          result = ''
          make_move(move)

       * match the termination marker. Only do this when headers are present,
       * but the result tag is missing

    header: function () {
      return set_header(arguments)
    },

    turn: function () {
      return turn
    },

    move: function (move, options) {
      /* The move function can be called with in the following parameters:
       *
       * .move('Nxb7')      <- where 'move' is a case-sensitive SAN string
       *
       * .move({ from: 'h7', <- where the 'move' is a move object (additional
       *         to :'h8',      fields are ignored)
       *         promotion: 'q',
       *      })

      // disambiguation bugs in Fritz and Chessbase

        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      var move_obj = null

      if (typeof move === 'string') {
        move_obj = move_from_san(move, sloppy)

        var moves = generate_moves()

        /* convert the pretty move object to an ugly move object */

            move.from === algebraic(moves[i].from) &&
            move.to === algebraic(moves[i].to) &&

            move_obj = moves[i]
            break
          }
        }

      }

       * move is made

      make_move(move_obj)

      return pretty_move

      var move = undo_move()
      return move ? make_pretty(move) : null
    },

    clear: function () {
      return clear()
    },

    put: function (piece, square) {
      return put(piece, square)
    },

    get: function (square) {
      return get(square)
    },

    ascii() {
      var s = '   +------------------------+\n'
      for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
        /* display the rank */
        if (file(i) === 0) {
          s += ' ' + '87654321'[rank(i)] + ' |'
        }

        /* empty piece */
        if (board[i] == null) {
          s += ' . '
        } else {
          var piece = board[i].type
          var color = board[i].color
          var symbol =
            color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
          s += ' ' + symbol + ' '
        }

        if ((i + 1) & 0x88) {
          s += '|\n'
          i += 8
        }
      }
      s += '   +------------------------+\n'
      s += '     a  b  c  d  e  f  g  h'

      return s
    },

    remove: function (square) {
      return remove(square)
    },

    perft: function (depth) {
      return perft(depth)
    },

    square_color: function (square) {
      if (square in SQUARE_MAP) {
        var sq_0x88 = SQUARE_MAP[square]
        return (rank(sq_0x88) + file(sq_0x88)) % 2 === 0 ? 'light' : 'dark'
      }

      return null
    },

      var reversed_history = []
      var move_history = []
      var verbose =
        typeof options !== 'undefined' &&
        'verbose' in options &&
        options.verbose

      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      while (reversed_history.length > 0) {
        var move = reversed_history.pop()
        if (verbose) {
          move_history.push(make_pretty(move))
        } else {
          move_history.push(move_to_san(move, generate_moves({ legal: true })))
        }
        make_move(move)
      }

      return move_history
    },

    get_comment: function () {
      return comments[generate_fen()]
    },

    set_comment: function (comment) {
      comments[generate_fen()] = comment.replace('{', '[').replace('}', ']')
    },

    delete_comment: function () {
      var comment = comments[generate_fen()]
      delete comments[generate_fen()]
      return comment
    },

    get_comments: function () {
      prune_comments()
      return Object.keys(comments).map(function (fen) {
        return { fen: fen, comment: comments[fen] }
      })
    },

    delete_comments: function () {
      prune_comments()
      return Object.keys(comments).map(function (fen) {
        var comment = comments[fen]
        delete comments[fen]
        return { fen: fen, comment: comment }
      })
    },
  }
}
